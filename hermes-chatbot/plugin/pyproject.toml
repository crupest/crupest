[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crupest-hermes-chatbot-plugin"
version = "0.1.0"
description = "Hermes platform plugin for a single QQ conversation via NapCat"
requires-python = ">=3.11"
dependencies = [
    "crupest-hermes-chatbot-core",
    "aiohttp>=3.9,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crupest_chatbot_plugin = ["plugin.yaml"]
