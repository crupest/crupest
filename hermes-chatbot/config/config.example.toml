# Example configuration. Copied to /opt/chatbot/config.toml on first start when
# that file is missing. Binding normally comes from the environment:
# CHATBOT_GROUP_ID / CHATBOT_USER_ID (env wins over this file).
#
# Both processes read this file. Tokens come from the environment
# (CHATBOT_ONEBOT_TOKEN / CHATBOT_PLUGIN_TOKEN), not from this file.

[chat]
# One conversation per adapter instance. Fill group_id, user_id, or both;
# leave empty to rely on CHATBOT_GROUP_ID / CHATBOT_USER_ID.
# group_id = 123456789
# user_id = 100001
active_window_seconds = 300

[adapter]
onebot_port = 18800
plugin_port = 18810
onebot_path = "/onebot"
plugin_path = "/hermes"
call_timeout_seconds = 60
upload_timeout_seconds = 600

[plugin]
# Streamed to disk, not buffered in memory; 1 GiB is a safety cap, not a target.
media_max_bytes = 1073741824
strip_markdown = true
max_message_length = 4500
rpc_timeout_margin_seconds = 20
# Subdirectory of the shared volume (same path in the Hermes and NapCat
# containers) so cached media can be re-sent; pruned at startup and daily.
cache_dir = "/opt/data/share/media"

[notify]
poke = false
member_change = false

# What the model may send. Disable a feature to make the tool reject that
# segment type (plain text replies are never affected).
[features]
at = true
# @全体 is enabled but should be used sparingly; SOUL asks the model to be careful.
at_all = true
face = true
dice = true
rps = true
poke = true
forward = true
upload = true

[limits]
poke_cooldown_seconds = 10
at_all_cooldown_seconds = 0
forward_cooldown_seconds = 10
forward_max_nodes = 20
upload_cooldown_seconds = 60
# 50 MiB: group files are persistent and visible to the whole group.
upload_max_bytes = 52428800
# Must be the shared volume mount; both Hermes and NapCat see this path.
upload_dir = "/opt/data/share"
max_segments_per_message = 100

[logging]
level = "INFO"
message_preview_chars = 80
