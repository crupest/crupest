[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.uv.workspace]
members = ["core", "adapter", "plugin"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "adapter/tests", "plugin/tests"]
pythonpath = ["core/src", "adapter/src", "plugin/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
