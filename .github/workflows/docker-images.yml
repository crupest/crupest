name: Docker Images

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: crupest-gateway
            context: deno
            file: deno/Dockerfile
            target: gateway
          - image: crupest-mail-server
            context: deno
            file: deno/Dockerfile
            target: mail-server
          - image: crupest-git-server
            context: services/docker/git-server
            file: services/docker/git-server/Dockerfile
            target: ""
          - image: crupest-roundcubemail
            context: services/docker/roundcube
            file: services/docker/roundcube/Dockerfile
            target: ""
          - image: crupest-auto-backup
            context: services/docker/auto-backup
            file: services/docker/auto-backup/Dockerfile
            target: ""
          - image: crupest-www
            context: www
            file: www/Dockerfile
            target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set lowercase image owner
        id: image-owner
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image-owner.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
