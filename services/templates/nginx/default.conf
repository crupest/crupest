server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Requests for unknown hosts end up here; keep them in their own file so
    # scanning/bombing sources can be inspected without polluting the site log.
    access_log /var/log/nginx/unknown-access.log;

    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    # Unknown SNI: drop the handshake instead of serving some default cert.
    # Rejected before any HTTP request exists, so there is nothing to log.
    ssl_reject_handshake on;

    return 444;
}
