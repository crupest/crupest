# Example configuration. Copied to /opt/qqbot/config.toml on first start when
# that file is missing. Binding normally comes from the environment:
# QQBOT_GROUP_ID / QQBOT_USER_ID (env wins over this file).
#
# Both processes read this file. Tokens come from the environment
# (QQBOT_ONEBOT_TOKEN / QQBOT_PLUGIN_TOKEN), not from this file.

[chat]
# One conversation per adapter instance. Fill group_id, user_id, or both;
# leave empty to rely on QQBOT_GROUP_ID / QQBOT_USER_ID.
# group_id = 123456789
# user_id = 100001
active_window_seconds = 300

[adapter]
onebot_port = 18800
plugin_port = 18810
onebot_path = "/onebot"
plugin_path = "/hermes"
call_timeout_seconds = 60
upload_timeout_seconds = 600

[plugin]
media_max_bytes = 20971520
strip_markdown = true
max_message_length = 4500
rpc_timeout_margin_seconds = 20
# Subdirectory of the shared volume (same path in the Hermes and NapCat
# containers) so cached media can be re-sent and cleaned up by cron.
cache_dir = "/opt/data/share/media"

[notify]
poke = false
member_change = false

[logging]
level = "INFO"
message_preview_chars = 80
