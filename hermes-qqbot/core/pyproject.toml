[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crupest-hermes-qqbot-core"
version = "0.1.0"
description = "Shared protocol, rendering and configuration for the QQ bot"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3"]

[tool.setuptools.packages.find]
where = ["src"]
