[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crupest-hermes-qqbot-adapter"
version = "0.1.0"
description = "OneBot 11 adapter for a single QQ conversation"
requires-python = ">=3.11"
dependencies = [
    "crupest-hermes-qqbot-core",
    "aiohttp>=3.9,<4",
]

[project.scripts]
crupest-qqbot-adapter = "crupest_qqbot_adapter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
